<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox — NivioIndia</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/extra.css">
</head>
<body data-depth="0">

<div id="wa-slot"></div>
<div id="nav-slot"></div>

<section class="page-head">
  <div class="wrap">
    <h1>Contact Form Inbox</h1>
    <p>Submissions sent through the contact form on this device.</p>
    <div class="crumbs"><a href="index.html">Home</a><span>/</span><span style="color:#fff;">Inbox</span></div>
  </div>
</section>

<section class="inbox-section">
  <div class="wrap">
    <div class="inbox-toolbar">
      <span style="font-size:13.5px;color:var(--fg-soft);"><b id="inboxCount" style="color:var(--ink);">0</b> submission(s) stored locally on this device</span>
      <button class="btn btn-line" id="clearInbox">Clear All <i class="fas fa-trash"></i></button>
    </div>
    <div class="inbox-list" id="inboxList"></div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/contact.js"></script>
</body>
</html>
