<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitemap — NivioIndia</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/extra.css">
</head>
<body data-depth="0">

<div id="wa-slot"></div>
<div id="nav-slot"></div>

<section class="page-head">
  <div class="wrap">
    <h1>Sitemap</h1>
    <p>All pages on NivioIndia.</p>
    <div class="crumbs"><a href="index.html">Home</a><span>/</span><span style="color:#fff;">Sitemap</span></div>
  </div>
</section>

<section class="svc-overview">
  <div class="wrap" style="max-width:820px;">
    <h3 style="margin-bottom:16px;font-family:'Space Grotesk',sans-serif;">Pages</h3>
    <ul class="tick-list" style="margin-bottom:40px;">
      <li><i class="fas fa-link"></i><a href="index.html">Home</a></li>
      <li><i class="fas fa-link"></i><a href="services.html">All Services</a></li>
      <li><i class="fas fa-link"></i><a href="about.html">About Us</a></li>
      <li><i class="fas fa-link"></i><a href="team.html">Our Team</a></li>
      <li><i class="fas fa-link"></i><a href="status.html">System Status</a></li>
      <li><i class="fas fa-link"></i><a href="contact.html">Contact</a></li>
      <li><i class="fas fa-link"></i><a href="privacy-policy.html">Privacy Policy</a></li>
    </ul>
    <h3 style="margin-bottom:16px;font-family:'Space Grotesk',sans-serif;">Service Pages</h3>
    <ul class="tick-list" id="svcLinks"></ul>
  </div>
</section>

<div id="footer-slot"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("svcLinks").innerHTML = SERVICES.map(s =>
    `<li><i class="fas fa-link"></i><a href="services/${s.slug}.html">${s.name}</a></li>`
  ).join("");
});
</script>
</body>
</html>
